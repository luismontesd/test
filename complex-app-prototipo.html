<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Complex App · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141512; --s1:#1c1d19; --s2:#24261f; --s3:#2f3129; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --tx:#f4f2ea; --mu:#aeb0a2; --mu2:#979a8c;
  --g:#3ea64b; --g2:#63d070; --gd:rgba(62,166,75,.17);
  --a:#f5a93b; --ad:rgba(245,169,59,.16);
  --r:#ef6a5c; --rd:rgba(239,106,92,.12);
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --rad:18px; --top:104px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.disp{font-family:var(--disp);letter-spacing:.01em}
.mu{color:var(--mu)} .mu2{color:var(--mu2)} .g{color:var(--g2)} .a{color:var(--a)} .r{color:var(--r)}
.sm{font-size:13px} .xs{font-size:11.5px} .b{font-weight:600}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(20,21,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.04em}
.brand span{font-size:11px;color:var(--mu);border:1px solid var(--line2);padding:2px 8px;border-radius:99px}
.reset{margin-left:auto;font-size:12px;color:var(--mu);padding:6px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
@media (max-width:440px){.brand span{display:none}}
.roles{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.roles::-webkit-scrollbar{display:none}
.roles button{white-space:nowrap;padding:10px 12px 12px;font-size:14px;font-weight:600;color:var(--mu);border-bottom:2px solid transparent}
.roles button.on{color:var(--tx);border-color:var(--a)}
.view{display:none}.view.on{display:block}

/* ---------- comunes ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.card.hi{background:linear-gradient(160deg,#25331f 0%,var(--s1) 70%);border-color:rgba(99,208,112,.25);position:relative;overflow:hidden}
.card.hi::after{content:'';position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:36px solid rgba(62,166,75,.08);border-right-color:transparent;transform:rotate(45deg);pointer-events:none}
.card.hi>*{position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;min-height:40px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:#0d1a0f;font-weight:700}
.chip.amb{background:var(--ad);border-color:rgba(245,169,59,.4);color:var(--a)}
.chip.grn{background:var(--gd);border-color:rgba(99,208,112,.35);color:var(--g2)}
.chip.red{background:var(--rd);border-color:rgba(239,106,92,.4);color:var(--r)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;background:var(--s3);border:1px solid var(--line2);font-size:14px}
.btn.pri{background:var(--g);border-color:var(--g);color:#0b170d}
.btn.amb{background:var(--a);border-color:var(--a);color:#241503}
.btn.ghost{background:transparent}
.btn.red{background:var(--rd);border-color:rgba(239,106,92,.5);color:var(--r)}
.fld{display:block;margin-top:12px}.fld>span{display:block;font-size:12px;color:var(--mu);margin-bottom:5px}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:44px;height:44px;border-radius:12px;background:var(--s3);font-size:20px;flex:none}.stepper input{text-align:center}
.secbox{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
.fzr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.fzr:last-child{border-bottom:0}
.kgb{font-family:var(--disp);font-size:26px;font-weight:800;padding:4px 12px;border-radius:12px;background:var(--gd);color:var(--g2);line-height:1.05;text-align:center;flex:none}
.kgb small{display:block;font-family:var(--body);font-size:10px;font-weight:600;color:var(--mu)}
.fzE{display:grid;grid-template-columns:1fr 1fr 1fr 44px;gap:6px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--s2)}
.fzE>select{grid-column:1/-1}
.fzE label span{display:block;font-size:11px;color:var(--mu);margin-bottom:3px}
.fzE input,.fzE select{padding:10px;background:var(--s1)}
.fzE .del{height:42px;border-radius:10px;background:var(--rd);color:var(--r);font-weight:700}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prog button{padding:10px 4px;border-radius:14px;background:var(--s1);border:1.5px solid var(--line);font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.prog button .e{display:block;font-size:20px;margin-bottom:2px}
.prog button .e .ico{width:24px;height:24px}
.prog button small{display:block;font-size:10.5px;font-weight:500;color:var(--mu);margin-top:1px}
.prog.mini button{padding:8px 4px;display:flex;align-items:center;justify-content:center;gap:6px}
.prog.mini button .e{display:inline;margin:0}
.prog.mini button .e .ico{width:18px;height:18px}
.prog.mini button small{display:none}
.prog button.on{border-color:var(--a);background:var(--ad);color:var(--a)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px;min-height:40px}
.linkish{display:block;text-align:left;width:100%;padding:10px 0 2px;color:var(--mu);font-size:12.5px;min-height:40px}
.ico{width:20px;height:20px;vertical-align:-4px;flex:none}
.demo{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:rgba(245,169,59,.18);color:var(--a);vertical-align:middle;margin-right:4px}
.aviso-x{min-width:44px;min-height:44px;margin:-12px -12px -12px 0;color:var(--mu)}
.btn:disabled{opacity:.45}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mu2)}
.h1{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1;letter-spacing:.01em}
.h2{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.05}
.h3{font-weight:700;font-size:16px}
.bar{height:6px;border-radius:9px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.bar.amb i{background:var(--a)}
.sep{height:1px;background:var(--line);margin:12px 0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--s3);color:var(--tx)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- atleta (teléfono) ---------- */
.phone{max-width:440px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom));min-height:calc(100dvh - var(--top))}
@media (min-width:700px){
  .phone{margin:20px auto;border:1px solid var(--line2);border-radius:34px;height:844px;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:0;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;scrollbar-width:none}
  .phone::-webkit-scrollbar{display:none}
  .tabbar{position:sticky!important;bottom:0;margin:20px -16px 0;border-radius:0 0 34px 34px}
}
/* Modo prueba (versión para clientes): solo la app del atleta + botón de opinión */
body.prueba .top,body.prueba #demoFab{display:none!important}
body.prueba .phone{min-height:100dvh;padding-top:calc(env(safe-area-inset-top) + 16px)}
.mis{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.mis:last-child{border-bottom:0}
.mis i{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.mis.ok i{background:var(--g);border-color:var(--g);color:#0b170d}
.mis.ok span{color:var(--mu);text-decoration:line-through}
/* en el celular, la app del atleta ocupa toda la pantalla; la demo se abre con el botón DEMO */
#demoFab{position:fixed;left:10px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:35;display:none;min-height:34px;padding:4px 10px;font-size:11px;opacity:.92;box-shadow:0 6px 20px rgba(0,0,0,.45)}
@media (max-width:699px){
  body.v-atleta .top{display:none}
  body.v-atleta .phone{min-height:100dvh;padding-top:calc(env(safe-area-inset-top) + 16px)}
  body.v-atleta #demoFab{display:inline-flex}
}
.scr{display:none;flex-direction:column;gap:14px}.scr.on{display:flex}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(28,29,25,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu2);padding:4px 8px;min-width:58px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--g2)}
.hello{display:flex;align-items:center;justify-content:space-between}
.me-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--a),#e07a2c);color:#241503;font-weight:800;display:grid;place-items:center}
.next-time{font-family:var(--disp);font-size:54px;font-weight:800;line-height:.9}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:var(--disp);font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:11.5px;color:var(--mu)}
.event{border-radius:var(--rad);padding:18px;background:radial-gradient(120% 140% at 100% 0%,rgba(245,169,59,.35),transparent 55%),linear-gradient(160deg,#2a2b22,#1a1b16);border:1px solid rgba(245,169,59,.3);position:relative;overflow:hidden}
.event .big{font-family:var(--disp);font-size:40px;font-weight:800;line-height:.9;text-transform:uppercase}
.event .big em{font-style:normal;color:var(--a)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:11px;color:var(--mu)}
.week button b{font-family:var(--disp);font-size:22px;color:var(--tx);line-height:1.1}
.week button.on{background:var(--g);border-color:var(--g);color:#0b170d}
.week button.on b{color:#0b170d}
.week button:disabled{opacity:.35}
.cls{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.cls.mine{border-color:rgba(99,208,112,.5);background:linear-gradient(90deg,rgba(62,166,75,.13),var(--s1))}
.cls .hr{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1}
.cls .bar{margin-top:7px;height:4px}
.cls.past{background:var(--bg)}
.cls.past .hr,.cls.past b{color:var(--mu)}
.cls.past .bar i{background:var(--mu2)}
.cls>div:last-child{display:flex;justify-content:flex-end}
.cls>div:last-child>*{min-width:112px;justify-content:center;display:inline-flex;align-items:center;min-height:40px}
.cls.pop{animation:pop .45s ease}
@keyframes pop{50%{transform:scale(1.04)}}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.t-cf{background:var(--gd);color:var(--g2)} .t-hib{background:var(--ad);color:var(--a)} .t-hal{background:rgba(120,160,255,.15);color:#9fb8ff} .t-teams{background:rgba(255,255,255,.1);color:#fff} .t-open{background:rgba(255,255,255,.07);color:var(--mu)}
.wod-sec{padding:14px 0;border-top:1px solid var(--line)}
.wod-sec:first-child{border-top:0;padding-top:0}
.mov{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:16px}
.mov:last-child{border-bottom:0}
.mov button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);font-size:14px;color:var(--mu);flex:none}
.lb{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb .pos{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--mu2);text-align:center}
.lb.me{background:var(--gd);margin:0 -10px;padding:10px;border-radius:12px;border:0}
.lb .sc{font-family:var(--disp);font-size:22px;font-weight:700}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;height:130px;margin:8px 0}
.plates .sleeve{width:70px;height:12px;background:linear-gradient(#cfd2c6,#8d9086);border-radius:3px}
.plates .collar{width:10px;height:26px;background:#9a9d92;border-radius:2px}
.plates .p{width:16px;border-radius:4px;box-shadow:inset -2px 0 0 rgba(0,0,0,.25)}
.pct{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pct div{background:var(--s2);border-radius:10px;padding:8px;text-align:center}
.pct b{display:block;font-family:var(--disp);font-size:20px}
.pct span{font-size:11px;color:var(--mu)}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--s3);display:block}
.heat i.y{background:var(--g)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.badge .ic{font-size:28px;line-height:1.1}
.badge b{display:block;font-size:12px;margin-top:4px}
.badge span{font-size:10.5px;color:var(--mu)}
.badge.lock .ic{opacity:.35;filter:grayscale(1)}
.badge.lock b{color:var(--mu)}
.reels{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:10px -4px 0;padding:0 4px}
.reels::-webkit-scrollbar{display:none}
.reel{flex:none;width:118px;aspect-ratio:9/16;border-radius:16px;position:relative;overflow:hidden;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.02;text-transform:uppercase;color:#fff;border:1px solid var(--line2)}
.reel::after{content:'▶';position:absolute;top:8px;right:10px;font-size:13px;opacity:.85}
.reel small{font-family:var(--body);font-size:10px;font-weight:600;text-transform:none;opacity:.8;margin-top:4px}
.story{display:block;width:62%;max-width:240px;margin:6px auto 0;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.5);aspect-ratio:9/16;background:var(--s2)}
.org{display:grid;grid-template-columns:28px 1fr 64px 64px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.org:last-child{border-bottom:0}
.org .bar{height:8px}
.post{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.fist{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;min-height:40px;border-radius:99px;background:var(--s2);font-size:13px;margin-top:8px}
.fist.on{background:var(--ad);color:var(--a)}
.ready{display:flex;align-items:center;gap:12px}
.ready .light{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--g);height:30px}

/* ---------- hoja inferior y avisos ---------- */
.sheet-wrap{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;color:var(--tx);display:none;align-items:flex-end;justify-content:center}
.sheet-wrap[open]{display:flex;animation:fade .2s}
.sheet-wrap::backdrop{background:rgba(0,0,0,.55)}
.sheet-x{position:absolute;top:6px;right:8px;width:44px;height:44px;color:var(--mu);font-size:18px;border-radius:12px}
.sheet{position:relative;width:100%;max-width:480px;max-height:90dvh;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;border:1px solid var(--line2);padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);z-index:99;background:#f4f2ea;color:#151612;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}

/* ---------- vistas de escritorio ---------- */
.desk{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.grid{display:grid;gap:14px}
@media (min-width:900px){.g-coach{grid-template-columns:260px 1fr 340px}.g-own{grid-template-columns:repeat(12,1fr)}}
.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.span3{grid-column:span 3}
@media (max-width:899px){.g-own>*{grid-column:1/-1!important}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font-family:var(--disp);font-size:34px;font-weight:800;line-height:1;margin:6px 0 2px}
.kpi .d{font-size:12px}
.kpi.hero{background:linear-gradient(160deg,#25331f,var(--s1));border-color:rgba(99,208,112,.25)}
.kpi.hero b{font-size:42px}
.clist button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid transparent}
.clist button.on{background:var(--s2);border-color:var(--line2)}
.clist .hr{font-family:var(--disp);font-size:22px;font-weight:700;width:54px}
@media (max-width:899px){.clist{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px!important}.clist::-webkit-scrollbar{display:none}.clist>.lbl{display:none}.clist button{flex:none;width:auto;padding:8px 12px}.clist .hr{width:auto}}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ath{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.ath.in{border-color:rgba(99,208,112,.45);background:linear-gradient(135deg,rgba(62,166,75,.12),var(--s1))}
.ath.new{border-color:rgba(245,169,59,.55);background:linear-gradient(135deg,rgba(245,169,59,.1),var(--s1))}
.hue{margin-left:auto;flex:none;text-align:right;font-size:11px;line-height:1.25;color:var(--mu2)}
.hue b{display:block;font-family:var(--disp);font-size:18px;color:var(--mu2)}
.ath.in .hue,.ath.in .hue b{color:var(--g2)}
.hue.no,.hue.no b{color:var(--r)}
.fp{display:grid;place-items:center;width:120px;height:120px;border-radius:50%;margin:10px auto;background:radial-gradient(circle,rgba(99,208,112,.25),transparent 70%);font-size:64px}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.flags span{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--s2);color:var(--mu)}
.flags .f-new{background:var(--ad);color:var(--a)} .flags .f-inj{background:var(--rd);color:var(--r)} .flags .f-ok{background:var(--gd);color:var(--g2)}
.hm{display:grid;grid-template-columns:44px repeat(8,1fr);gap:4px;font-size:11px}
.hm i{display:grid;place-items:center;height:30px;border-radius:7px;font-style:normal;font-size:11px;font-weight:600}
.hm .h{color:var(--mu2);text-align:center}
.funnel div{display:flex;align-items:center;gap:10px;margin:8px 0}
.funnel .fb{height:30px;border-radius:9px;background:var(--g);display:flex;align-items:center;padding:0 10px;font-weight:700;color:#0b170d;font-size:13px;white-space:nowrap}
.risk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.risk:last-child{border-bottom:0}
.insight{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--s2);margin-top:8px}
.insight .ic{font-size:20px}

/* ---------- TV ---------- */
.tv{min-height:calc(100dvh - var(--top));padding:22px;display:grid;gap:18px;grid-template-columns:1fr;background:radial-gradient(80% 60% at 50% 0%,#20301d,transparent),var(--bg)}
@media (min-width:1000px){.tv{grid-template-columns:1.5fr 1fr;grid-template-rows:1fr auto}}
.tv .panel{background:rgba(28,29,25,.8);border:1px solid var(--line);border-radius:24px;padding:24px}
.tv .wname{font-family:var(--disp);font-size:58px;font-weight:800;text-transform:uppercase;line-height:.9}
.tv .tmov{font-family:var(--disp);font-size:32px;font-weight:600;padding:8px 0;border-bottom:1px solid var(--line)}
.tv .lbt{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;font-size:20px;padding:9px 0;border-bottom:1px solid var(--line)}
.tv .lbt b{font-family:var(--disp);font-size:28px}
.ticker{grid-column:1/-1;overflow:hidden;white-space:nowrap;border-radius:16px;background:var(--g);color:#0b170d;font-weight:800;font-family:var(--disp);font-size:26px;letter-spacing:.03em;padding:10px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 38s linear infinite}
.ticker:hover span,.ticker:active span{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:16px;white-space:normal}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---------- clase gratis ---------- */
.lead{max-width:520px;margin:0 auto;padding:20px 16px 60px}
.hero{border-radius:24px;padding:26px 20px;background:radial-gradient(100% 120% at 0% 0%,rgba(62,166,75,.35),transparent 60%),radial-gradient(80% 90% at 100% 100%,rgba(245,169,59,.25),transparent 60%),var(--s1);border:1px solid var(--line2);margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--s1);border:1.5px solid var(--line);margin-bottom:8px}
.opt.on{border-color:var(--g);background:var(--gd)}
.opt .e{font-size:24px}
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--s3)}
.steps i.on{background:var(--a)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mu);margin:10px 0}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--g)}

/* ---------- análisis ---------- */
.an h2{font-family:var(--disp);font-size:30px;font-weight:800;margin:30px 0 12px;line-height:1}
.an p,.an li{color:#dcdbd2}
.an ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:800px){.facts{grid-template-columns:repeat(4,1fr)}}
.mapa{display:grid;gap:12px}
@media (min-width:900px){.mapa{grid-template-columns:repeat(3,1fr)}}
.mapa .card li{font-size:14px}
.src{font-size:12px;color:var(--mu2);margin-top:30px}
.src a{color:var(--mu)}
</style>
</head>

      <button data-s="clases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Clases</button>

      <button data-s="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progreso</button>

    </nav>

<!-- ================= COACH ================= -->

<script>
/* =========================================================
   Complex App · prototipo de Corola
   Todo vive en este archivo. Los datos son de ejemplo y se
   guardan sólo en este navegador (localStorage).
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LS='complex-proto-v1';
function rnd(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return ((h>>>0)%10000)/10000}
const mxn=n=>'$'+Math.round(n).toLocaleString('es-MX');
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')};
const ini=n=>String(n).split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
/* Todo texto que escribe una persona pasa por esc() antes de pintarse */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Reloj de la demo: lunes 5 de octubre de 2026, 6:40 a.m. */
const AHORA={dia:0,min:6*60+40};
const DIAS=[{n:'Lun',d:5,l:'Lunes 5 oct'},{n:'Mar',d:6,l:'Martes 6 oct'},{n:'Mié',d:7,l:'Miércoles 7 oct'},{n:'Jue',d:8,l:'Jueves 8 oct'},{n:'Vie',d:9,l:'Viernes 9 oct'},{n:'Sáb',d:10,l:'Sábado 10 oct'},{n:'Dom',d:11,l:'Domingo 11 oct',cerrado:true}];
const TIPOS={cf:'CrossFit',hib:'Híbrido',hal:'Halterofilia',teams:'Teams',open:'Open box'};

function DEF(){return{
  v:4,
  me:{nombre:'Mariana',ap:'R.',nivel:'Intermedio',plan:'Ilimitado · CrossFit + Gym',vence:'28 oct',lesion:'Hombro izquierdo: evitar overhead pesado',clasesMes:3,racha:6,total:96},
  reservas:['0-0700-cf','2-0700-hib'],espera:[],liberados:{},
  prs:{
    'Back squat':[['Mar',62],['May',68],['Jun',72],['Jul',77],['Ago',80],['Sep',85]],
    'Deadlift':[['Mar',85],['May',95],['Jul',102],['Sep',110]],
    'Clean':[['Abr',48],['Jun',52],['Ago',57],['Sep',60]],
    'Snatch':[['Abr',35],['Jul',40],['Sep',45]],
    'Front squat':[['May',58],['Jul',64],['Sep',70]],
    'Strict press':[['Abr',33],['Jul',37],['Sep',40]]
  },
  bench:[['Fran','6:12','21-15-9 thrusters y pull-ups'],['Grace','3:48','30 clean & jerks'],['Cindy','14 rondas','AMRAP 20′'],['Helen','11:20','3 rondas run, KB, pull-ups'],['Murph','—','Pendiente: ¿noviembre?']],
  prog:'cf',
  wods:{
    cf:{nombre:'Sudar sabroso',cal:'3 rondas: 200 m remo, 10 air squats, 8 PVC pass-through, 30″ hollow hold',calMin:8,
      fz:[{mov:'Back squat',ser:3,rep:'5',pct:65},{mov:'Back squat',ser:3,rep:'3',pct:75},{mov:'Back squat',ser:2,rep:'2',pct:82}],
      tipo:'AMRAP',min:14,
      RX:['12 Wall balls (9/6 kg)','10 Box jumps (24/20")','8 Pull-ups','200 m Run'],
      Intermedio:['12 Wall balls (6/4 kg)','10 Box step-ups (20")','8 Jumping pull-ups','200 m Run'],
      Principiante:['10 Wall balls (4/3 kg)','10 Step-ups (16")','8 Ring rows','150 m Run o 250 m Remo'],
      nota:'La técnica siempre va primero. Busca un ritmo que puedas sostener los 14 minutos: nadie gana el WOD en el minuto 2.'},
    hib:{nombre:'Motor y estaciones',cal:'10′ trote suave, movilidad de cadera y tobillo, 3 × 20 m de zancadas',calMin:10,
      fz:[{mov:'Deadlift',ser:4,rep:'6',pct:60}],
      tipo:'FOR TIME',min:40,
      RX:['1 km Run','50 m Sled push (pesado)','1 km Run','50 m Sled pull (pesado)','1 km Run','80 m Burpee broad jumps','1 km Run','100 Wall balls (9/6 kg)'],
      Intermedio:['1 km Run','50 m Sled push (medio)','1 km Run','50 m Sled pull (medio)','1 km Run','80 m Burpee broad jumps','1 km Run','75 Wall balls (6/4 kg)'],
      Principiante:['600 m Run','25 m Sled push (ligero)','600 m Run','25 m Sled pull (ligero)','600 m Run','40 m Burpee broad jumps','600 m Run','50 Wall balls (4/3 kg)'],
      nota:'Medio simulador rumbo al 17 de octubre. Anota tu tiempo: con eso armamos tu ritmo para el evento.'},
    hal:{nombre:'Técnica y potencia',cal:'Barra sola: 2 rondas de Burgener warm-up, 5 snatch balance y 5 muscle clean',calMin:10,
      fz:[{mov:'Snatch',ser:5,rep:'2',pct:70},{mov:'Clean',ser:5,rep:'2',pct:75},{mov:'Front squat',ser:4,rep:'3',pct:75}],
      tipo:'CARGA MÁX',min:12,
      RX:['3 × 5 Pull de snatch al 95% del snatch','3 × 10 Hip thrust','3 × 30″ Hollow hold'],
      Intermedio:['3 × 5 Pull de snatch al 85% del snatch','3 × 10 Hip thrust','3 × 30″ Hollow hold'],
      Principiante:['3 × 8 Pull de snatch con barra ligera','3 × 10 Hip thrust','3 × 20″ Hollow hold'],
      nota:'Calidad antes que carga: si la técnica se rompe, bajamos 5%. Registra tu levantamiento más pesado del día.'}
  },
  escala:null,
  mios:{cf:null,hib:null,hal:null},
  ready:null,
  feed:[
    {id:1,who:'Coach Beto',txt:'Sofía L. sacó su primer muscle-up en la clase de 7:00 🎉 Aquí se celebra cada pequeña victoria.',t:'hace 2 h',n:23},
    {id:2,who:'Complex',txt:'Podios de nuestros coaches y atletas este fin de semana 🥇🥇🥉 #WeAreComplex',t:'ayer',n:58},
    {id:3,who:'Pau M.',txt:'Nuevo PR en deadlift: 120 kg 💪 gracias Coach Luis por la paciencia con la técnica.',t:'ayer',n:31},
    {id:4,who:'Cafetería Complex',txt:'Nuevo en la barra: cold brew con proteína para después del WOD ☕️',t:'sáb',n:12}],
  choca:{},
  evento:null,
  teams:false,
  pedidos:[],
  prospectos:[],
  huella:{},hN:0,
  cls:{},avisos:[],compartidas:0,
  reto:{hechas:3,meta:20},
};}
let S;try{const g=JSON.parse(localStorage.getItem(LS));if(g&&g.v===4){const d=DEF();S={...d,...g,me:{...d.me,...g.me},wods:{...d.wods,...g.wods},mios:{...d.mios,...g.mios}}}}catch(e){}
if(!S)S=DEF();
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ---------- horario ---------- */
function mk(di,h,t,c,cap){const id=di+'-'+h.replace(':','')+'-'+t;let base=Math.round(cap*(.42+.5*rnd(id)));
  if(id==='0-1900-cf')base=cap; if(id==='0-0700-cf')base=13; if(id==='0-0600-cf')base=16;
  const o=(S.cls||{})[id]||{};
  return{id,di,h,t,n:TIPOS[t],c:o.c||c,cap:o.cap||cap,base,area:o.area||'',nota:o.nota||'',cancel:o.cancel||null}}
function clasesDe(di){
  if(di===6)return[];
  if(di===5)return[mk(5,'09:00','teams','Todos los coaches',40),mk(5,'11:00','open','Coach Luis',30)];
  const L=[mk(di,'06:00','cf','Coach Ana',18),mk(di,'07:00','cf','Coach Beto',18)];
  if(di%2===0)L.push(mk(di,'07:00','hib','Coach Dani',14));
  L.push(mk(di,'08:00','cf','Coach Ana',18),mk(di,'09:00','cf','Coach Luis',18));
  if(di%2===1)L.push(mk(di,'12:00','hal','Coach Luis',10));
  L.push(mk(di,'18:00','cf','Coach Dani',18),mk(di,'19:00','cf','Coach Beto',18));
  if(di%2===1)L.push(mk(di,'19:00','hib','Coach Dani',14));
  L.push(mk(di,'20:00','cf','Coach Ana',18));
  return L}
const todas=()=>[0,1,2,3,4,5].flatMap(clasesDe);
const clase=id=>todas().find(c=>c.id===id);
const minDe=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
function ocupados(c){return c.base-(S.liberados[c.id]||0)+(S.reservas.includes(c.id)?1:0)+S.prospectos.filter(p=>p.clase===c.id).length}
function estado(c){if(c.di<AHORA.dia)return'fin';if(c.di===AHORA.dia){const m=minDe(c.h);if(m+60<=AHORA.min)return'fin';if(m<=AHORA.min)return'curso'}return'ok'}

/* ---------- utilidades de interfaz ---------- */
let toastT;
function toast(msg){const t=$('#toast'),d=$('#sheetWrap');(d.open?d:document.body).appendChild(t);t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3800)}
/* Hojas inferiores: <dialog> nativo (cierra con Escape, no deja escapar el foco). hojaN cambia cada vez que se abre o cierra una. */
let hojaN=0,hojaPrev=null;
function sheet(html){hojaN++;const d=$('#sheetWrap');if(!d.open)hojaPrev=document.activeElement;
  $('#sheet').innerHTML='<div class="grab" aria-hidden="true"></div><button class="sheet-x" onclick="cerrar()" aria-label="Cerrar">✕</button>'+html;
  const t=$('#sheet .h2');d.setAttribute('aria-label',t?t.textContent:'Ventana');
  if(!d.open){try{d.showModal()}catch(e){d.setAttribute('open','')}}
  $('#sheet').scrollTop=0;document.body.style.overflow='hidden'}
function cerrar(){hojaN++;const d=$('#sheetWrap');if(d.open){try{d.close()}catch(e){d.removeAttribute('open')}}document.body.style.overflow=''}
$('#sheetWrap').addEventListener('close',()=>{document.body.style.overflow='';document.body.appendChild($('#toast'));if(hojaPrev&&document.contains(hojaPrev)&&hojaPrev.focus)hojaPrev.focus();hojaPrev=null});
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')cerrar()});
/* Los selectores (chips, disciplinas, días, opciones) anuncian si están elegidos */
function marcarElegidos(){$$('.chips>button.chip,.prog>button,.opt,.week>button').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('on')))}
new MutationObserver(()=>queueMicrotask(marcarElegidos)).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});

/* ---------- navegación ---------- */
function irVista(v){$$('#roles button').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.toggleAttribute('aria-current',b.dataset.v===v)});document.body.className='v-'+v+(window.__PRUEBA?' prueba':'');$$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  try{history.replaceState(null,'','#'+v)}catch(e){}
  ({atleta:renderAtleta,coach:renderCoach,duenio:renderDuenio,tv:renderTV,gratis:renderGratis,analisis:renderAnalisis})[v]();window.scrollTo(0,0)}
$('#roles').addEventListener('click',e=>{const b=e.target.closest('button');if(b)irVista(b.dataset.v)});
let pant='hoy';
function irPant(p){pant=p;if(window.__PRUEBA){S.visto=S.visto||[];if(!S.visto.includes(p)){S.visto.push(p);save()}}$$('#tabbar button').forEach(b=>{b.classList.toggle('on',b.dataset.s===p);b.toggleAttribute('aria-current',b.dataset.s===p)});$$('.scr').forEach(s=>s.classList.toggle('on',s.id==='s-'+p));renderAtleta();window.scrollTo(0,0);$('#phone').scrollTop=0}
$('#tabbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)irPant(b.dataset.s)});
function reiniciar(){if(confirm('¿Reiniciar todos los datos de la demo?')){S=DEF();save();cerrar();irVista('atleta');irPant('hoy');toast('Demo reiniciada')}}
$('#reset').onclick=reiniciar;
$('#demoFab').onclick=()=>sheet(`<div class="h2">Demo de Complex</div><p class="mu sm" style="margin:4px 0 12px">Cambia de vista para enseñar cada parte de la app.</p>
  <div class="col">${[['atleta','📱','Atleta'],['coach','📋','Coach'],['duenio','📊','Dueño'],['tv','📺','Pantalla del box'],['gratis','🎟️','Clase gratis'],['analisis','🔍','Análisis']].map(([v,e,n])=>`<button class="opt" onclick="cerrar();irVista('${v}')"><span class="e" aria-hidden="true">${e}</span><b>${n}</b></button>`).join('')}</div>
  <button class="btn full ghost" style="margin-top:8px" onclick="reiniciar()">Reiniciar demo</button>`);

/* =========================================================
   ATLETA
   ========================================================= */
function renderAtleta(){({hoy:pHoy,clases:pClases,wod:pWod,progreso:pProgreso,comunidad:pComunidad})[pant]()}
const escala=()=>S.escala||S.me.nivel;
const PROG={cf:'CrossFit',hib:'Híbrido',hal:'Halterofilia'};
const PROG_SUB={cf:'clases en grupo',hib:'estilo HYROX',hal:'técnica y fuerza'};

const NIV={cf:{RX:'RX',Intermedio:'Intermedio',Principiante:'Principiante'},hib:{RX:'Pro',Intermedio:'Open',Principiante:'Inicial'},hal:{RX:'Avanzado',Intermedio:'Intermedio',Principiante:'Técnica'}};
const TIPOS_M=[['AMRAP','AMRAP'],['FOR TIME','For time'],['EMOM','EMOM'],['CARGA MÁX','Sin metcon · carga máx.']];
const progDe=t=>t==='hib'?'hib':t==='hal'?'hal':'cf';
const prog=()=>S.prog||'cf';

const nl=(k,p=prog())=>NIV[p][k];
function proxima(){return S.reservas.map(clase).filter(c=>c&&!c.cancel&&estado(c)!=='fin').sort((a,b)=>a.di-b.di||minDe(a.h)-minDe(b.h))[0]}
function prActual(l){const a=S.prs[l];return a[a.length-1][1]}
function kgDe(mov,pct){if(!S.prs[mov])return null;return Math.round(prActual(mov)*pct/100/2.5)*2.5}
const metLbl=w=>({AMRAP:`AMRAP ${w.min}′`,'FOR TIME':`For time · límite ${w.min}′`,EMOM:`EMOM ${w.min}′`,'CARGA MÁX':'Sin metcon'})[w.tipo];
const fzTxt=f=>`${f.ser}×${f.rep} al ${f.pct}%`;
const SAMPLES={
  cf:[['Luis G.','RX',.92],['Sofía L.','RX',.8],['Diego A.','RX',.7],['Pau M.','Intermedio',.85],['Regina C.','Intermedio',.6],['Jorge V.','Intermedio',.45],['Caro S.','Principiante',.55],['Toño H.','Principiante',.3]],
  hib:[['Valeria N.','RX',.9],['Rodrigo B.','RX',.75],['Emilio F.','Intermedio',.8],['Ximena O.','Intermedio',.55],['Lu Z.','Principiante',.6],['Fer T.','Principiante',.35]],
  hal:[['Andrés P.','RX',.85],['Dani Q.','RX',.6],['Majo E.','Intermedio',.7],['Iván R.','Intermedio',.4],['Caro S.','Principiante',.5]]};
function puntaje(w,s,q){
  if(w.tipo==='FOR TIME')return{t:Math.round(w.min*60*(.5+.42*(1-q)))};
  if(w.tipo==='CARGA MÁX')return{kg:{RX:72.5,Intermedio:52.5,Principiante:32.5}[s]+Math.round(q*20/2.5)*2.5,mov:(w.fz[0]||{}).mov||''};
  const tot=Math.round((60+q*120)*(w.min/14));return{r:Math.floor(tot/30),p:tot%30}}
function lbList(p=prog()){const w=S.wods[p];if(w.tipo==='EMOM')return[];
  const L=SAMPLES[p].map(([n,s,q])=>({n,s,...puntaje(w,s,q)}));
  const m=S.mios[p];if(m&&m.tipo===w.tipo)L.push({...m,n:S.me.nombre+' '+S.me.ap,me:1});
  const o={RX:0,Intermedio:1,Principiante:2};
  return L.sort((a,b)=>o[a.s]-o[b.s]||(w.tipo==='FOR TIME'?a.t-b.t:w.tipo==='CARGA MÁX'?b.kg-a.kg:(b.r-a.r||b.p-a.p)))}
const scoreTxt=(x,p=prog())=>{const t=S.wods[p].tipo;return t==='FOR TIME'?fmt(x.t):t==='CARGA MÁX'?x.kg+' kg':x.r+'+'+x.p};

    return`<div class="cls ${mine?'mine':''} ${st==='fin'||c.cancel?'past':''} ${pop?'pop':''}"><div class="hr">${c.h}</div>
      <div><div class="row" style="gap:6px"><span class="tag t-${c.t}">${c.n}</span></div><div class="sm mu" style="margin-top:3px">${c.c}${c.area?' · '+c.area:''}</div>${c.cancel?`<div class="xs r" style="margin-top:3px">Cancelada</div>`:c.nota?`<div class="xs a" style="margin-top:3px">📌 ${esc(c.nota)}</div>`:''}

function reservar(id){if(S.reservas.includes(id))return;const c0=clase(id);if(!c0||c0.cancel)return;if(ocupados(c0)>=c0.cap){if(!S.espera.includes(id))esperar(id);return}
  S.reservas.push(id);save();window._pop=id;pClases();const c=clase(id);toast(`Listo: ${c.n} ${DIAS[c.di].n} ${c.h}. Te recordamos 1 h antes.`)}
function esperar(id){if(S.espera.includes(id))return;S.espera.push(id);save();pClases();toast('Estás en la lista de espera. Te avisamos si se libera un lugar.');setTimeout(()=>resolverEspera(id),4500)}
/* En la demo, el lugar se libera a los pocos segundos. Se guarda en S.espera, así que también se resuelve si recargas. */
function resolverEspera(id){if(!S.espera.includes(id))return;S.espera=S.espera.filter(x=>x!==id);const c=clase(id);
  if(!c||c.cancel){save();renderAtleta();return}
  S.liberados[id]=(S.liberados[id]||0)+1;if(!S.reservas.includes(id))S.reservas.push(id);save();

const hhmm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');

function llegada(c,a){const k=S.huella[c.id+a.n];if(k)return k;if(a.me||a.nuevo)return null;
  const st=estado(c),m=minDe(c.h),v=rnd(a.n+c.id);
  if(st!=='ok')return v>.12?hhmm(m-3-Math.floor(v*15)):null;
  if(c.di===0&&m-AHORA.min<=30&&v>.5)return hhmm(Math.min(AHORA.min,m-3-Math.floor(v*25)));
  return null}

function hojaClase(id,tab='clase',P){
  const c=clase(id),ins=Math.min(ocupados(c),99);P=P||progDe(c.t);const w=S.wods[P];
  const tabs=`<div class="chips" style="margin-bottom:6px" role="group" aria-label="Sección del panel"><button class="chip ${tab==='clase'?'on':''}" onclick="hojaClase('${id}','clase')">La clase</button><button class="chip ${tab==='wod'?'on':''}" onclick="hojaClase('${id}','wod','${P}')">WOD del día</button></div>`;
  const head=`<div class="lbl">Panel de la clase</div><div class="h2" style="margin:4px 0 12px">${c.n} · ${DIAS[c.di].l} · ${c.h}</div>`;
  if(tab==='clase'){
    sheet(head+tabs+`
    <label class="fld"><span>Coach</span><select id="ec">${COACHES.map(x=>`<option ${x===c.c?'selected':''}>${x}</option>`).join('')}</select></label>
    <div class="fld"><span id="lcap">Cupo · ${ins} con reserva</span><div class="stepper"><button onclick="$('#ecap').value=Math.max(1,+$('#ecap').value-1)" aria-label="Restar un lugar">−</button><input id="ecap" type="number" inputmode="numeric" value="${c.cap}" aria-labelledby="lcap"><button onclick="$('#ecap').value=+$('#ecap').value+1" aria-label="Sumar un lugar">+</button></div></div>
    <div class="fld"><span>Área</span><div class="chips" id="ear" role="group" aria-label="Área">${AREAS.map(x=>`<button class="chip ${x===(c.area||'Box principal')?'on':''}">${x}</button>`).join('')}</div></div>
    <label class="fld"><span>Nota para quienes reservaron (les llega en la app)</span><textarea id="eno" rows="2" placeholder="Ej. Hoy traigan cuerda para saltar">${esc(c.nota)}</textarea></label>
    <button class="btn pri full" style="margin-top:16px" id="eOk">Guardar cambios</button>
    <div class="secbox">
      ${c.cancel?`<div class="sm" style="margin-top:12px"><b class="r">Esta clase está cancelada</b> · ${esc(c.cancel)}</div><button class="btn full" style="margin-top:10px" id="eRe">Reabrir clase</button>`
      :`<div class="lbl" style="margin-top:12px">Cancelar esta clase · el motivo no lo ven los atletas</div><div class="chips" id="emo" style="margin-top:8px;flex-wrap:wrap" role="group" aria-label="Motivo">${['Coach enfermo','Lluvia','Evento en el box','Mantenimiento','Otro'].map((x,i)=>`<button class="chip ${i?'':'on'}">${x}</button>`).join('')}</div>
        <button class="btn red full" style="margin-top:10px" id="eCa">Cancelar clase y avisar a ${ins} ${ins===1?'persona':'personas'}</button>`}
    </div>`);
    $('#ear').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#ear .chip').forEach(x=>x.classList.toggle('on',x===b))};
    const mine=S.reservas.includes(id),tuClase=()=>`Tu clase de ${c.n} del ${DIAS[c.di].l.toLowerCase()} a las ${c.h}`;
    $('#eOk').onclick=()=>{const o=S.cls[id]||{},cap=Math.max(1,+$('#ecap').value||c.cap),nc=$('#ec').value,nota=$('#eno').value.trim();
      const cambios=[];if(nc!==c.c)cambios.push('ahora la da '+nc);if(nota&&nota!==c.nota)cambios.push('nota: '+nota);
      S.cls[id]={...o,c:nc,cap,area:$('#ear .on').textContent,nota};
      if(mine&&cambios.length)S.avisos.push(tuClase()+': '+cambios.join(' · ')+'.');
      save();cerrar();renderCoach();toast(cambios.length?`Guardado · avisamos a ${ins} ${ins===1?'persona':'personas'} con reserva`:'Cambios guardados')};
    if(c.cancel)$('#eRe').onclick=()=>{S.cls[id]={...S.cls[id],cancel:null};save();cerrar();renderCoach();toast('Clase reabierta')};
    else{$('#emo').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#emo .chip').forEach(x=>x.classList.toggle('on',x===b))};
      $('#eCa').onclick=()=>{if(!confirm(`¿Cancelar ${c.n} de las ${c.h}? Se avisará a ${ins} ${ins===1?'persona':'personas'} con reserva.`))return;const mot=$('#emo .on').textContent;
        S.cls[id]={...(S.cls[id]||{}),cancel:mot};
        if(mine){S.reservas=S.reservas.filter(x=>x!==id);S.avisos.push(`${tuClase()} se canceló. No pierdes nada: reserva otro horario cuando quieras.`)}
        save();cerrar();renderCoach();toast(`Clase cancelada · avisamos a ${ins} ${ins===1?'persona':'personas'}`)}}
    return}
  // ---- WOD del día (uno por disciplina)
  const ta=(id,arr)=>`<textarea id="${id}" rows="4">${esc(arr.join('\n'))}</textarea>`;
  let tipo=w.tipo;const fzD=w.fz.map(f=>({...f}));
  const movOpts=sel=>Object.keys(S.prs).map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
  sheet(head+tabs+`
    <div class="fld"><span>¿Qué WOD vas a programar?</span><div class="prog" role="group" aria-label="Disciplina">${Object.keys(PROG).map(k=>`<button class="${k===P?'on':''}" onclick="hojaClase('${id}','wod','${k}')"><span class="e">${PROG_E[k]}</span>${PROG[k]}<small>${PROG_SUB[k]}</small></button>`).join('')}</div></div>
    <div class="xs mu" style="margin-top:8px">Lo ven todas las clases de ${PROG[P]} del día y los atletas que elijan ${PROG[P]} en su app.</div>
    <label class="fld"><span>Nombre del WOD</span><input id="wn" value="${esc(w.nombre)}"></label>
    <div class="secbox"><div class="lbl" style="margin-top:12px">A · Calentamiento</div>
      <label class="fld"><span>Minutos</span><input id="wcm" type="number" inputmode="numeric" value="${w.calMin}"></label>
      <label class="fld"><span>Qué hacen · déjalo vacío si no hay calentamiento</span><textarea id="wc" rows="2">${esc(w.cal)}</textarea></label></div>
    <div class="secbox"><div class="lbl" style="margin-top:12px">B · Fuerza</div>
      <div class="xs mu" style="margin-top:6px">Agrega las líneas que necesites. La app calcula el peso de cada atleta con su PR.</div>
      <div id="fzRows"></div>
      <button class="btn sm full" style="margin-top:10px" id="fzAdd">+ Agregar series</button></div>
    <div class="secbox"><div class="lbl" style="margin-top:12px">C · Metcon</div>
      <div class="fld"><span>Tipo</span><div class="chips" id="wtp" style="flex-wrap:wrap" role="group" aria-label="Tipo de metcon">${TIPOS_M.map(([v,l])=>`<button class="chip ${v===tipo?'on':''}" data-v="${v}">${l}</button>`).join('')}</div></div>
      <label class="fld" id="wmBox"><span id="wml"></span><input id="wm" type="number" inputmode="numeric" value="${w.min}"></label>
      <label class="fld"><span><span id="wlb">Movimientos</span> · ${NIV[P].RX} · uno por línea</span>${ta('wr',w.RX)}</label>
      <div class="xs mu" style="margin-top:10px">Si dejas vacía una escala, se usa la versión ${NIV[P].RX}.</div>
      <label class="fld"><span>${NIV[P].Intermedio}</span>${ta('wi',w.Intermedio)}</label>
      <label class="fld"><span>${NIV[P].Principiante}</span>${ta('wp',w.Principiante)}</label></div>
    <label class="fld"><span>Nota del coach</span><textarea id="wt" rows="2">${esc(w.nota)}</textarea></label>
    <button class="btn pri full" style="margin-top:16px" id="wOk">Publicar WOD de ${PROG[P]}</button>`);
  const drawFz=()=>{$('#fzRows').innerHTML=fzD.length?fzD.map((f,i)=>`<div class="fzE">
      <select data-i="${i}" data-k="mov" aria-label="Movimiento de la línea ${i+1}">${movOpts(f.mov)}</select>
      <label><span>Series</span><input data-i="${i}" data-k="ser" type="number" inputmode="numeric" value="${f.ser}"></label>
      <label><span>Reps</span><input data-i="${i}" data-k="rep" value="${esc(f.rep)}"></label>
      <label><span>% del PR</span><input data-i="${i}" data-k="pct" type="number" inputmode="numeric" value="${f.pct}"></label>
      <button class="del" data-del="${i}" aria-label="Quitar línea ${i+1}">✕</button></div>`).join(''):'<div class="sm mu" style="margin-top:10px">Sin fuerza hoy.</div>'};
  const syncTipo=()=>{$('#wmBox').style.display=tipo==='CARGA MÁX'?'none':'';$('#wml').textContent=tipo==='FOR TIME'?'Tiempo límite (min)':'Minutos';$('#wlb').textContent=tipo==='CARGA MÁX'?'Accesorios':'Movimientos'};
  drawFz();syncTipo();
  $('#fzRows').addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(i==null)return;const k=t.dataset.k;fzD[i][k]=k==='ser'||k==='pct'?+t.value:t.value});
  $('#fzRows').addEventListener('change',e=>{const t=e.target,i=t.dataset.i;if(i!=null&&t.dataset.k==='mov')fzD[i].mov=t.value});
  $('#fzRows').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;fzD.splice(+b.dataset.del,1);drawFz()});
  $('#fzAdd').onclick=()=>{const l=fzD[fzD.length-1];fzD.push(l?{...l,pct:Math.min(100,l.pct+5)}:{mov:Object.keys(S.prs)[0],ser:3,rep:'5',pct:70});drawFz()};
  $('#wtp').onclick=e=>{const b=e.target.closest('button');if(!b)return;tipo=b.dataset.v;$$('#wtp .chip').forEach(x=>x.classList.toggle('on',x===b));syncTipo()};
  $('#wOk').onclick=()=>{const L=x=>$(x).value.split('\n').map(v=>v.trim()).filter(Boolean);
    const rx=L('#wr');if(!rx.length&&tipo!=='CARGA MÁX'){toast(`Agrega al menos un movimiento en ${NIV[P].RX}.`);return}
    const fz=fzD.filter(f=>f.ser>0&&String(f.rep).trim()).map(f=>({mov:f.mov,ser:+f.ser,rep:String(f.rep).trim(),pct:Math.min(110,Math.max(30,+f.pct||70))}));
    S.wods[P]={nombre:$('#wn').value.trim()||w.nombre,cal:$('#wc').value.trim(),calMin:Math.max(1,+$('#wcm').value||8),fz,
      tipo,min:Math.max(1,+$('#wm').value||w.min),RX:rx,Intermedio:L('#wi').length?L('#wi'):rx,Principiante:L('#wp').length?L('#wp'):rx,nota:$('#wt').value.trim()};
    save();cerrar();renderCoach();toast(`✅ WOD de ${PROG[P]} publicado en la app y la pantalla`)}}

const HRS=['6','7','8','9','12','18','19','20'];
function occ(d,h){if(d===5)return h==='9'?92:h==='12'?0:0;if(h==='12')return d%2?34:0;const base={6:78,7:96,8:64,9:48,18:84,19:100,20:58}[h];return Math.max(15,Math.min(100,Math.round(base-(d===4?18:0)-(d===3?6:0)+(rnd(d+h)*10-5))))}
